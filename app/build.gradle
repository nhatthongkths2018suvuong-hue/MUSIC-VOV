plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.example.boxplayer'
    compileSdk 34
    defaultConfig {
        applicationId 'com.example.musicbox.vov'
        minSdk 23
        targetSdk 23
        versionCode 1
        versionName '1.0-vov'
        resourceConfigurations += ['en', 'vi']   // bỏ chuỗi dịch của các ngôn ngữ khác trong thư viện
    }
    buildTypes {
        release {
            minifyEnabled true        // R8: bỏ code thư viện không dùng, rút gọn tên
            shrinkResources true      // bỏ tài nguyên không dùng
            signingConfig signingConfigs.debug   // ký bằng khóa debug để cài trực tiếp được
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
}
